name: ci

# 本 workflow 只做唯讀檢查：不修改任何 GitHub 設定、不上傳 artifact、不呼叫會寫入的 API。
on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 同一個分支的新 push 會取消前一次未完成的執行。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: 格式、測試與秘密掃描
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      # 固定 commit SHA，不使用浮動 tag；升級方式見 docs/development.md。
      - name: 取得程式碼（完整歷史，秘密掃描需要）
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          # 不把 token 留在工作目錄的 .git/config；後續步驟也沒有寫入需求。
          persist-credentials: false

      - name: 安裝 Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # Gitleaks 固定版本並校驗 SHA-256；不符即中止。
      # 校驗和取自官方發布的 gitleaks_8.30.1_checksums.txt。
      - name: 安裝 Gitleaks 8.30.1（固定版本 + 校驗和）
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict -
          tar -xzf "$archive" gitleaks
          chmod +x gitleaks
          mkdir -p "$HOME/.local/bin"
          mv gitleaks "$HOME/.local/bin/gitleaks"
          # GITHUB_PATH 只對「後續」步驟生效，所以本步驟用絕對路徑驗證。
          "$HOME/.local/bin/gitleaks" version
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: 執行統一檢查（格式 → 測試 → Bash 語法 → Python 語法 → Gitleaks 歷史與 staged）
        # 測試的預設 gitleaks 路徑是本機暫存位置，在 runner 上不存在會被 skip，讓 CI 綠燈
        # 但等於沒跑真實掃描。必須在 shell 內展開 $HOME（Actions 的 env: 不做 shell 展開），
        # 這樣測試與掃描用的是前一步安裝並校驗過的同一支執行檔；只影響這個 step 的子行程。
        run: RPA_REAL_GITLEAKS="$HOME/.local/bin/gitleaks" bash scripts/run-checks.sh
