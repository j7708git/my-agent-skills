title = "my-agent-skills 自有 repo 秘密掃描設定"

[extend]
# 沿用 Gitleaks 官方預設規則，完整套用。
useDefault = true

# 這個檔案刻意「沒有」任何 allowlist。
#
# 測試用的合成憑證（形狀像真實密鑰、但不是真憑證）以分段常量在執行時組合，
# 所以原始碼裡不會出現完整字面值，預設規則不會命中它們。
# 這是刻意的選擇：與其在這裡為幾個合成 fixture 開豁免，
# 不如讓產品原始碼從頭到尾不含「看起來像真秘密」的字串——
# 豁免清單本身就是一種風險，一有新增測試常數就要更新，漏更新就等於關掉保護。
#
# 驗證方式：在暫存 clone 上以真實 gitleaks 8.30.1 掃描工作樹與完整歷史，
# 兩者都必須是 0 筆發現。